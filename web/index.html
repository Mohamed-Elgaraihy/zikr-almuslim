  <style>
    body { margin: 0; background: #06261E; }
  </style>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #06261E;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.zikrShare = async function (text, filename) {
      if (navigator.share) {
        try {
          await navigator.share({ text: text, title: filename || 'ذكر المسلم' });
          return true;
        } catch (error) {
          if (error && error.name === 'AbortError') return true;
        }
      }
      if (filename) {
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
        return true;
      }
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_) {
        return false;
      }
    };
    window.zikrPick = function () {
      return new Promise(function (resolve) {
        const input = document.createElement('input');
        let settled = false;
        function finish(value) {
          if (settled) return;
          settled = true;
          resolve(value);
        }
        input.type = 'file';
        input.accept = '.json,application/json,text/plain';
        input.onchange = function () {
          const file = input.files && input.files[0];
          if (!file) {
            finish(null);
            return;
          }
          const reader = new FileReader();
          reader.onload = function () { finish(String(reader.result || '')); };
          reader.onerror = function () { finish(null); };
          reader.readAsText(file);
        };
        window.addEventListener('focus', function () {
          setTimeout(function () {
            if (!input.files || !input.files.length) finish(null);
          }, 700);
        }, { once: true });
        input.click();
      });
    };
    window.zikrWake = null;
    window.zikrAwake = async function (on) {
      try {
        if (!on) {
          if (window.zikrWake) await window.zikrWake.release();
          window.zikrWake = null;
          return;
        }
        if (navigator.wakeLock) {
          window.zikrWake = await navigator.wakeLock.request('screen');
        }
      } catch (_) {}
    };
  </script>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
